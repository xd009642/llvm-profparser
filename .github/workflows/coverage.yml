name: Coverage
on:
  push:
    branches:
      - "*"
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version:
          - stable
        target:
          - x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.version }}
          override: true
          components: llvm-tools-preview
      - name: code-coverage
        run: |
          cargo install cargo-binutils@0.3.6
          cargo install cargo-tarpaulin
          cargo tarpaulin --all-features --force-clean --exclude-files tests/data/* benches/* --follow-exec --coveralls ${{ secrets.CODECOV_TOKEN }} --engine llvm
